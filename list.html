<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 현황</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Apple SD Gothic Neo", sans-serif; background: #f2ede5; color: #1b1d21; }

  header { background: #C72C48; padding: 16px 0; }
  header nav { max-width: 1400px; margin: 0 auto; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 24px; font-weight: 700; color: white; }
  .nav-center { display: flex; gap: 50px; flex: 1; margin-left: 60px; font-size: 15px; color: white; }
  .nav-center span { cursor: pointer; transition: opacity 0.3s; }
  .nav-center span:hover { opacity: 0.8; }
  .nav-icons { display: flex; gap: 30px; color: white; font-size: 20px; }
  .nav-icons span { cursor: pointer; }

  main { max-width: 1400px; margin: 0 auto; padding: 50px 40px; }

  .header-section { margin-bottom: 40px; }
  h1 { font-size: 28px; margin-bottom: 12px; }
  .meta { color: #666; font-size: 14px; }
  .meta a { color: #C72C48; text-decoration: none; font-weight: 600; }

  .table-container { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

  table { width: 100%; border-collapse: collapse; }

  thead { background: #f5f5f5; border-bottom: 2px solid #C72C48; }
  th { padding: 16px 12px; text-align: left; font-size: 13px; font-weight: 700; color: #1b1d21; }
  th.text-center { text-align: center; }
  th.text-right { text-align: right; }

  tbody tr { border-bottom: 1px solid #eee; cursor: pointer; transition: background-color 0.2s; }
  tbody tr:hover { background: #f9f7f3; }

  td { padding: 16px 12px; font-size: 14px; }
  td.text-center { text-align: center; }
  td.text-right { text-align: right; }
  td.num { font-variant-numeric: tabular-nums; }

  .product-cell { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .product-emoji { font-size: 24px; }

  .price { font-weight: 700; color: #C72C48; }
  .date { color: #999; font-size: 12px; }
</style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">☕ 커피 자판기</div>
      <div class="nav-center">
        <span>메뉴</span>
        <span>소개</span>
        <span>정보</span>
      </div>
      <div class="nav-icons">
        <span>🔍</span>
        <span>❤️</span>
        <span>🛒</span>
        <span>👤</span>
      </div>
    </nav>
  </header>

  <main>
    <section class="header-section">
      <h1>판매 현황</h1>
      <p class="meta">최신 구매가 맨 위에 옵니다. <span id="count"></span>건 · <a href="index.html">새 주문 등록</a></p>
    </section>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>상품</th>
            <th>구매자</th>
            <th class="text-center">수량</th>
            <th class="text-right">단가</th>
            <th class="text-right">합계</th>
            <th>구매 시각</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

<script>
const productEmojis = {
  '카페라떼': '☕',
  '아메리카노': '☕',
  '코코아': '🍫',
  '우유': '🥛',
  '율무차': '🍵',
  '아이스크림': '🍦',
  '핫초콜릿': '🍫',
  '에스프레소': '☕',
};

function getEmoji(product) {
  return productEmojis[product] || '☕';
}

async function load() {
  const res = await fetch('/api/list');
  if (!res.ok) {
    document.getElementById('count').textContent = '불러오기 실패';
    return;
  }
  const rows = await res.json();
  document.getElementById('count').textContent = rows.length;
  document.getElementById('rows').innerHTML = rows.map(r => {
    const purchasedAt = new Date(r.purchased_at).toLocaleString('ko-KR');
    const emoji = getEmoji(r.product);
    return `
      <tr onclick="location.href='detail.html?id=${r.id}'">
        <td>${r.id}</td>
        <td>
          <div class="product-cell">
            <span class="product-emoji">${emoji}</span>
            <span>${r.product}</span>
          </div>
        </td>
        <td>${r.buyer_name}</td>
        <td class="text-center num">${r.quantity}개</td>
        <td class="text-right num">${r.price_per_unit.toLocaleString('ko-KR')}원</td>
        <td class="text-right num"><span class="price">${r.total_price.toLocaleString('ko-KR')}원</span></td>
        <td><span class="date">${purchasedAt}</span></td>
      </tr>
    `;
  }).join('');
}
load();
</script>
</body>
</html>
