<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 현황</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Apple SD Gothic Neo", sans-serif; background: #f2ede5; color: #1b1d21; }

  header { background: #C72C48; padding: 16px 0; }
  header nav { max-width: 1400px; margin: 0 auto; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 24px; font-weight: 700; color: white; }
  .nav-center { display: flex; gap: 50px; flex: 1; margin-left: 60px; font-size: 15px; color: white; }
  .nav-center span { cursor: pointer; transition: opacity 0.3s; }
  .nav-center span:hover { opacity: 0.8; }
  .nav-icons { display: flex; gap: 30px; color: white; font-size: 20px; }
  .nav-icons span { cursor: pointer; }

  main { max-width: 1400px; margin: 0 auto; padding: 50px 40px; }

  .menu-tabs { display: flex; gap: 60px; margin-bottom: 50px; border-bottom: 2px solid #ddd; padding-bottom: 20px; }
  .menu-tab { font-size: 18px; font-weight: 600; color: #666; cursor: pointer; position: relative; }
  .menu-tab.active { color: #1b1d21; }
  .menu-tab.active::after { content: ''; position: absolute; bottom: -22px; left: 0; right: 0; height: 3px; background: #C72C48; }

  .page-title { font-size: 28px; font-weight: 700; margin-bottom: 40px; text-align: center; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }

  .card { background: white; border-radius: 8px; overflow: hidden; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(0,0,0,0.12); }

  .card-image { width: 100%; aspect-ratio: 1; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #999; }

  .card-body { padding: 20px; }
  .card-product { font-size: 16px; font-weight: 700; margin-bottom: 12px; text-align: center; }
  .card-info { font-size: 12px; color: #666; text-align: center; margin-bottom: 8px; }
  .card-price { font-size: 18px; font-weight: 700; color: #C72C48; text-align: center; margin-top: 12px; }

  @media (max-width: 1024px) {
    .cards { grid-template-columns: repeat(3, 1fr); }
    header nav { padding: 0 20px; }
    main { padding: 40px 20px; }
    .nav-center { gap: 30px; margin-left: 40px; }
  }

  @media (max-width: 768px) {
    .cards { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .menu-tabs { gap: 30px; }
    .menu-tab { font-size: 14px; }
  }
</style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">☕ 커피 자판기</div>
      <div class="nav-center">
        <span>메뉴</span>
        <span>소개</span>
        <span>정보</span>
      </div>
      <div class="nav-icons">
        <span>🔍</span>
        <span>❤️</span>
        <span>🛒</span>
        <span>👤</span>
      </div>
    </nav>
  </header>

  <main>
    <div class="menu-tabs">
      <div class="menu-tab active">전체 판매</div>
      <div class="menu-tab">최근 주문</div>
      <div class="menu-tab">인기 상품</div>
    </div>

    <h2 class="page-title">판매 현황 (<span id="count"></span>건)</h2>

    <div class="cards" id="rows"></div>

    <div style="text-align: center; margin-top: 40px;">
      <a href="index.html" style="color: #C72C48; text-decoration: none; font-weight: 600;">새 주문 등록 →</a>
    </div>
  </main>

<script>
async function load() {
  const res = await fetch('/api/list');
  if (!res.ok) {
    document.getElementById('count').textContent = '불러오기 실패';
    return;
  }
  const rows = await res.json();
  document.getElementById('count').textContent = rows.length;
  document.getElementById('rows').innerHTML = rows.map(r => {
    const purchasedAt = new Date(r.purchased_at).toLocaleDateString('ko-KR');
    return `
      <div class="card" onclick="location.href='detail.html?id=${r.id}'">
        <div class="card-image">
          <span style="font-size: 14px;">#${r.id}</span>
        </div>
        <div class="card-body">
          <div class="card-product">${r.product}</div>
          <div class="card-info">${r.buyer_name}</div>
          <div class="card-info">${r.quantity}개 × ${r.price_per_unit.toLocaleString('ko-KR')}원</div>
          <div class="card-price">${r.total_price.toLocaleString('ko-KR')}원</div>
        </div>
      </div>
    `;
  }).join('');
}
load();
</script>
</body>
</html>
