<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 현황</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Apple SD Gothic Neo", sans-serif; background: #f5f5f5; color: #1b1d21; }

  header { background: #C72C48; color: white; padding: 16px 0; }
  header nav { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 20px; font-weight: 700; }
  .nav-links { display: flex; gap: 30px; flex: 1; margin-left: 40px; font-size: 14px; }
  .nav-right { display: flex; gap: 20px; }
  .nav-right a { color: white; text-decoration: none; cursor: pointer; }

  main { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
  .header-section { margin-bottom: 40px; }
  h1 { font-size: 32px; margin-bottom: 12px; }
  .meta { color: #666; font-size: 14px; }
  .meta a { color: #C72C48; text-decoration: none; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .card { background: white; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }

  .card-header { background: #C72C48; color: white; padding: 20px; }
  .card-id { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
  .card-product { font-size: 20px; font-weight: 700; }

  .card-body { padding: 20px; }
  .card-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
  .card-label { color: #666; }
  .card-value { font-weight: 600; }
  .card-price { font-size: 24px; font-weight: 700; color: #C72C48; margin-top: 16px; padding-top: 12px; border-top: 1px solid #eee; }
</style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">☕ 커피 자판기</div>
      <div class="nav-links">
        <span>메뉴</span>
        <span>브랜드</span>
      </div>
      <div class="nav-right">
        <a href="index.html">주문하기</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="header-section">
      <h1>판매 현황</h1>
      <p class="meta">최신 구매가 맨 위에 옵니다. <span id="count"></span> · <a href="index.html">새 주문 등록</a></p>
    </section>
    <div class="cards" id="rows"></div>
  </main>

<script>
async function load() {
  const res = await fetch('/api/list');
  if (!res.ok) {
    document.getElementById('count').textContent = '불러오기에 실패했습니다';
    return;
  }
  const rows = await res.json();
  document.getElementById('count').textContent = '총 ' + rows.length + '건';
  document.getElementById('rows').innerHTML = rows.map(r => {
    const purchasedAt = new Date(r.purchased_at).toLocaleString('ko-KR');
    return `
      <div class="card" onclick="location.href='detail.html?id=${r.id}'">
        <div class="card-header">
          <div class="card-id">#${r.id} · ${r.buyer_name}</div>
          <div class="card-product">${r.product}</div>
        </div>
        <div class="card-body">
          <div class="card-row">
            <span class="card-label">수량</span>
            <span class="card-value">${r.quantity}개</span>
          </div>
          <div class="card-row">
            <span class="card-label">단가</span>
            <span class="card-value">${r.price_per_unit.toLocaleString('ko-KR')}원</span>
          </div>
          <div class="card-row">
            <span class="card-label">구매</span>
            <span class="card-value" style="font-size: 12px;">${purchasedAt}</span>
          </div>
          <div class="card-price">${r.total_price.toLocaleString('ko-KR')}원</div>
        </div>
      </div>
    `;
  }).join('');
}
load();
</script>
</body>
</html>
