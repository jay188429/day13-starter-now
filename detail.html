<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 상세</title>
<style>
  body { font-family: "Apple SD Gothic Neo", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1b1d21; }
  h1 { font-size: 24px; }
  .back { margin-bottom: 16px; }
  .back a { color: #0d6d64; }
  .detail { margin-top: 24px; }
  .detail-row { display: flex; border-bottom: 1px solid #ddd; padding: 12px 0; }
  .detail-label { width: 100px; font-weight: 600; color: #666; }
  .detail-value { flex: 1; }
  .error { color: #d32f2f; }
</style>
</head>
<body>
  <div class="back"><a href="list.html">← 목록으로 돌아가기</a></div>
  <h1>주문 상세</h1>
  <div id="content"></div>

<script>
async function load() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  if (!id) {
    document.getElementById('content').innerHTML = '<p class="error">주문 ID가 없습니다.</p>';
    return;
  }

  const res = await fetch(`/api/list?id=${id}`);
  if (!res.ok) {
    document.getElementById('content').innerHTML = '<p class="error">주문을 불러올 수 없습니다.</p>';
    return;
  }

  const data = await res.json();
  const purchasedAt = new Date(data.purchased_at).toLocaleString('ko-KR');

  document.getElementById('content').innerHTML = `
    <div class="detail">
      <div class="detail-row">
        <div class="detail-label">주문 ID</div>
        <div class="detail-value">${data.id}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">구매자</div>
        <div class="detail-value">${data.buyer_name}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">상품</div>
        <div class="detail-value">${data.product}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">수량</div>
        <div class="detail-value">${data.quantity}개</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">단가</div>
        <div class="detail-value">${data.price_per_unit.toLocaleString('ko-KR')}원</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">합계</div>
        <div class="detail-value" style="font-weight: 600; color: #0d6d64;">${data.total_price.toLocaleString('ko-KR')}원</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">구매 시각</div>
        <div class="detail-value">${purchasedAt}</div>
      </div>
    </div>
  `;
}

load();
</script>
</body>
</html>
