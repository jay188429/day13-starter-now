<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 영수증</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Courier New", monospace;
    background: #f5f5f5;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .receipt {
    background: white;
    width: 100%;
    max-width: 380px;
    padding: 30px 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    border-radius: 4px;
  }

  .receipt-header {
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px dashed #ccc;
  }

  .store-name {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 4px;
  }

  .store-info {
    font-size: 11px;
    color: #666;
    line-height: 1.6;
  }

  .divider {
    border-bottom: 2px dashed #ccc;
    margin: 12px 0;
  }

  .receipt-body {
    font-size: 13px;
    margin-bottom: 16px;
  }

  .receipt-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    align-items: center;
  }

  .receipt-label {
    font-weight: normal;
    color: #555;
  }

  .receipt-value {
    text-align: right;
    font-weight: 500;
  }

  .product-name {
    font-size: 14px;
    font-weight: bold;
    margin: 12px 0 8px 0;
    text-align: center;
  }

  .quantity-price {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #666;
    margin-bottom: 8px;
  }

  .receipt-total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 15px;
    font-weight: bold;
    padding: 12px 0;
    border-top: 2px dashed #ccc;
    border-bottom: 2px dashed #ccc;
    margin: 12px 0;
    color: #C72C48;
  }

  .total-label {
    font-size: 14px;
  }

  .total-amount {
    font-size: 24px;
  }

  .receipt-footer {
    text-align: center;
    font-size: 11px;
    color: #888;
    line-height: 1.8;
    padding: 16px 0;
    border-bottom: 2px dashed #ccc;
  }

  .footer-message {
    text-align: center;
    font-size: 12px;
    color: #666;
    margin: 16px 0;
    font-style: italic;
  }

  .button-group {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn {
    flex: 1;
    padding: 12px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    font-family: "Apple SD Gothic Neo", sans-serif;
  }

  .btn-primary {
    background: #C72C48;
    color: white;
    border-color: #C72C48;
  }

  .btn-primary:hover {
    background: #a31c35;
  }

  .btn-secondary:hover {
    background: #f5f5f5;
  }

  .error {
    text-align: center;
    color: #d32f2f;
    padding: 40px 20px;
  }

  @media print {
    body { background: white; padding: 0; }
    .receipt { box-shadow: none; }
    .button-group { display: none; }
  }
</style>
</head>
<body>
  <div class="receipt">
    <div id="content"></div>
  </div>

<script>
async function load() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  if (!id) {
    document.getElementById('content').innerHTML = '<div class="error">주문 ID가 없습니다.</div>';
    return;
  }

  const res = await fetch(`/api/list?id=${id}`);
  if (!res.ok) {
    document.getElementById('content').innerHTML = '<div class="error">주문을 불러올 수 없습니다.</div>';
    return;
  }

  const data = await res.json();
  const purchasedAt = new Date(data.purchased_at);
  const date = purchasedAt.toLocaleDateString('ko-KR');
  const time = purchasedAt.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

  document.getElementById('content').innerHTML = `
    <div class="receipt-header">
      <div class="store-name">☕ 커피 자판기</div>
      <div class="store-info">
        판매 기록 영수증<br>
        Order Receipt
      </div>
    </div>

    <div class="divider"></div>

    <div class="receipt-body">
      <div class="receipt-row">
        <span class="receipt-label">주문번호</span>
        <span class="receipt-value">#${data.id}</span>
      </div>

      <div class="receipt-row">
        <span class="receipt-label">구매자</span>
        <span class="receipt-value">${data.buyer_name}</span>
      </div>

      <div class="product-name">${data.product}</div>

      <div class="quantity-price">
        <span>${data.quantity}개 × ${data.price_per_unit.toLocaleString('ko-KR')}원</span>
      </div>

      <div class="receipt-total">
        <span class="total-label">합계</span>
        <span class="total-amount">${data.total_price.toLocaleString('ko-KR')}원</span>
      </div>

      <div class="receipt-row">
        <span class="receipt-label">구매일시</span>
        <span class="receipt-value">${date} ${time}</span>
      </div>
    </div>

    <div class="receipt-footer">
      감사합니다<br>
      Thank you!
    </div>

    <div class="footer-message">
      "언제나 맛있는 커피를 드리겠습니다"
    </div>

    <div class="button-group">
      <button class="btn btn-secondary" onclick="location.href='list.html'">목록</button>
      <button class="btn btn-primary" onclick="location.href='index.html'">새 주문</button>
    </div>
  `;
}

load();
</script>
</body>
</html>
